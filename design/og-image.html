<!doctype html>
<!-- Share-preview image source. Render at 1200x630 to public/og.png (e.g. a Playwright screenshot). -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    background: #ff6b35; color: #fff; font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: space-between; padding: 0 84px 0 92px;
  }
  .brand { display: flex; flex-direction: column; gap: 26px; }
  .brand svg { width: 132px; height: 132px; filter: drop-shadow(0 10px 24px rgba(120, 40, 0, .25)); }
  h1 { font-size: 118px; font-weight: 900; margin: 0; letter-spacing: -4px; line-height: 1; white-space: nowrap; }
  p { font-size: 46px; font-weight: 700; margin: 0; line-height: 1.3; opacity: .95; }

  .cards { position: relative; width: 430px; height: 470px; flex: none; }
  .card {
    position: absolute; width: 256px; background: #fff; color: #1c1917; border-radius: 28px;
    box-shadow: 0 18px 44px rgba(120, 40, 0, .28); padding: 18px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 10px;
  }
  .thumb { height: 116px; border-radius: 16px; }
  .badge { align-self: flex-start; font-size: 17px; font-weight: 800; padding: 2px 9px; border-radius: 7px; }
  .title { font-size: 25px; font-weight: 700; line-height: 1.25; }
  .votes { font-size: 19px; color: #78716c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .votes b { color: #ff6b35; font-weight: 900; }
  .btn { height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; margin-top: 4px; }

  .back { left: 0; top: 64px; transform: rotate(-8deg); }
  .back .thumb { background: #fee500; }
  .back .badge { background: #fee500; color: #000; }
  .back .btn { border: 3px solid #e7e5e4; color: #1c1917; }

  .front { left: 158px; top: 24px; transform: rotate(6deg); }
  .front .thumb { background: #03c75a; }
  .front .badge { background: #03c75a; color: #fff; }
  .front .btn { background: #ff6b35; color: #fff; }
</style>

<div class="brand">
  <!-- The app icon (design/icon.svg) with colors inverted, so it stands out on the orange background. -->
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#fff"/>
    <path d="M32 9c-8.3 0-15 6.5-15 14.7C17 34.5 32 50 32 50s15-15.5 15-26.3C47 15.5 40.3 9 32 9z" fill="#ff6b35"/>
    <rect x="24.5" y="16.5" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2.6"/>
    <path d="M27.5 23l3.6 3.6L40 16" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>여기서맛나</h1>
  <p>어디서 만날까?<br>후보를 모아 같이 골라요</p>
</div>

<div class="cards">
  <div class="card back">
    <div class="thumb"></div>
    <span class="badge">카카오</span>
    <div class="title">을지로 노가리 골목</div>
    <div class="votes"><b>1명</b> · 준호</div>
    <div class="btn">선택</div>
  </div>
  <div class="card front">
    <div class="thumb"></div>
    <span class="badge">네이버</span>
    <div class="title">성수 파스타 키친</div>
    <div class="votes"><b>3명</b> · 민수, 지영, 하늘</div>
    <div class="btn">✓ 선택됨</div>
  </div>
</div>
