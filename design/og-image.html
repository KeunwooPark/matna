<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #ff6b35; font-family: "Noto Sans CJK KR"; color: #fff; display: flex; align-items: center; padding: 0 96px; box-sizing: border-box; gap: 72px; overflow: hidden; }
  .text { flex: 1; }
  h1 { font-size: 168px; font-weight: 900; margin: 0; letter-spacing: -6px; line-height: 1; }
  p { font-size: 56px; font-weight: 700; margin: 28px 0 0; line-height: 1.3; }
  .cards { position: relative; width: 340px; height: 420px; }
  .card { position: absolute; width: 230px; height: 300px; background: #fff; border-radius: 28px; box-shadow: 0 16px 40px rgba(0,0,0,.18); padding: 18px; box-sizing: border-box; }
  .card .img { height: 130px; border-radius: 16px; }
  .card .line { height: 22px; border-radius: 11px; background: #e5e7eb; margin-top: 18px; }
  .card .btn { height: 44px; border-radius: 14px; margin-top: 22px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
  .c1 { left: 0; top: 70px; transform: rotate(-8deg); }
  .c2 { left: 110px; top: 40px; transform: rotate(6deg); }
  .c1 .img { background: #03c75a; } .c2 .img { background: #fee500; }
  .c1 .btn { border: 3px solid #e5e7eb; color: #171717; } .c2 .btn { background: #ff6b35; color: #fff; }
</style>
<div class="text">
  <h1>맛나</h1>
  <p>어디서 만날까?<br>같이 골라요</p>
</div>
<div class="cards">
  <div class="card c1"><div class="img"></div><div class="line"></div><div class="line" style="width:60%"></div><div class="btn">선택</div></div>
  <div class="card c2"><div class="img"></div><div class="line"></div><div class="line" style="width:70%"></div><div class="btn">✓ 선택됨</div></div>
</div>
